<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Logbook{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('web.static', filename='app.css') }}">
</head>
<body>
{% if session.get('auth') %}
<header class="masthead">
  <a class="wordmark" href="{{ url_for('web.devices') }}">
    Logbook<span class="rule-dot"></span>
  </a>
  {% block breadcrumb %}{% endblock %}
  <form method="post" action="{{ url_for('web.logout') }}" class="signout">
    <button type="submit">Sign out</button>
  </form>
</header>
{% endif %}

<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
