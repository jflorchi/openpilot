{% extends "base.html" %}
{% block title %}Sign in — Logbook{% endblock %}

{% block content %}
<div class="gate">
  <p class="gate-eyebrow">Self-hosted</p>
  <h1 class="gate-title">Logbook</h1>
  <p class="gate-sub">Drive recordings from your own devices, on your own server.</p>

  <form method="post" class="gate-form">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Enter</button>
  </form>
</div>
{% endblock %}
